name: CI and GitHub Pages

on:
  push:
    branches: [main, integrate/hk-upstream]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Regression tests and static-site checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression tests
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Verify Pages entry point and local module references
        shell: bash
        run: |
          test -s index.html
          test -s js/main.js
          test -s js/hk-geodata.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          if (!html.includes('<title>Slop Hong Kong</title>')) throw new Error('Missing Hong Kong page title');
          if (!html.includes('src="./js/main.js"')) throw new Error('Missing browser module entry point');
          for (const path of ['js/main.js', 'js/hk-geodata.js']) {
            if (!fs.statSync(path).isFile()) throw new Error(`Missing ${path}`);
          }
          console.log('Static Pages entry point looks present.');
          NODE

  deploy:
    name: Publish GitHub Pages
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
